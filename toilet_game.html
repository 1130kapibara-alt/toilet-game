<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>トイレ戦略ゲーム（オンライン対戦版）</title>
<style>
body { font-family: Arial; text-align: center; }
.board { display: flex; justify-content: center; margin: 20px; flex-wrap: wrap; }
.cell {
  width: 60px; height: 100px; border: 2px solid black;
  margin: 5px; display: flex; align-items: center;
  justify-content: center; font-size: 14px; flex-direction: column;
}
.A { background-color: lightblue; }
.B { background-color: lightcoral; }
.handrail { border: 3px dashed green; }
button { padding: 6px; margin: 4px; }
</style>
</head>
<body>

<h2>トイレ戦略ゲーム（オンライン）</h2>

<input id="room" placeholder="ルーム名" />
<button onclick="joinRoom()">入室</button>

<p id="turn"></p>
<div id="hand"></div>
<div class="board" id="board"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Firebase設定（あなたのもの）
const firebaseConfig = {
  apiKey: "AIzaSyBkl_OmRWO5GAndT_IA_i8Ct0maPK5cmpQ",
  authDomain: "toire-4e52f.firebaseapp.com",
  projectId: "toire-4e52f",
  storageBucket: "toire-4e52f.firebasestorage.app",
  messagingSenderId: "798228844466",
  appId: "1:798228844466:web:726cd3d03074b48f4e9eab"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ===== ゲーム変数 =====
let roomId = "room1";
let size;
let board;
let currentPlayer;
let hands = { A: [], B: [] };
let usedSpecial = { A: false, B: false };
let playerRole = "A";
let selectedCard = null;

// ===== キャラ確率 =====
function getRandomCharacter() {
  const r = Math.random();
  if (r < 0.2) return "子供";
  if (r < 0.3) return "お年寄り";
  return "男性";
}

// ===== 初期化 =====
function initGame() {
  size = Math.floor(Math.random() * 7) + 9;
  board = Array(size).fill(null).map(() => ({ player: null, handrail: false }));

  let handrailCount = Math.floor(Math.random() * 2) + 2;
  for (let i = 0; i < handrailCount; i++) {
    let idx;
    do { idx = Math.floor(Math.random() * size); } while (board[idx].handrail);
    board[idx].handrail = true;
  }

  hands.A = getHand();
  hands.B = getHand();
  currentPlayer = "A";
}

// ===== 手札 =====
function getHand() {
  let h = [];
  for (let i = 0; i < 5; i++) h.push(getRandomCharacter());
  h.push("ぶっとび");
  return h;
}

// ===== 保存 =====
async function save() {
  await setDoc(doc(db, "games", roomId), {
    board, currentPlayer, hands, usedSpecial
  });
}

// ===== 入室 =====
function joinRoom() {
  roomId = document.getElementById("room").value || "room1";

  const ref = doc(db, "games", roomId);

  onSnapshot(ref, (snap) => {
    const d = snap.data();
    if (d) {
      board = d.board;
      currentPlayer = d.currentPlayer;
      hands = d.hands;
      usedSpecial = d.usedSpecial;
      render();
    }
  });

  initGame();
  save();
}

// ===== 描画 =====
function render() {
  document.getElementById("turn").innerText = `現在: ${currentPlayer}`;

  const handDiv = document.getElementById("hand");
  handDiv.innerHTML = "";

  hands[currentPlayer]?.forEach((c, i) => {
    const b = document.createElement("button");
    b.innerText = c;
    b.onclick = () => selectedCard = { name: c, index: i };
    handDiv.appendChild(b);
  });

  const bd = document.getElementById("board");
  bd.innerHTML = "";

  board.forEach((cell, i) => {
    const d = document.createElement("div");
    d.className = "cell" + (cell.player ? " " + cell.player : "") + (cell.handrail ? " handrail" : "");
    d.innerHTML = `${cell.player || ""}<br>${cell.handrail ? "手すり" : ""}`;
    d.onclick = () => place(i);
    bd.appendChild(d);
  });
}

// ===== 置けるか判定 =====
function canPlace(i) {
  if (board[i].player) return false;
  if (board[i - 1]?.player) return false;
  if (board[i + 1]?.player) return false;
  return true;
}

// ===== 配置 =====
async function place(i) {
  if (!selectedCard) return alert("カード選択して");
  if (currentPlayer !== playerRole) return alert("相手のターン");

  let card = selectedCard.name;

  if (card === "男性") {
    if (!canPlace(i)) return;
    board[i].player = currentPlayer;
  }

  if (card === "子供") {
    if (board[i].player) return;
    board[i].player = currentPlayer;
  }

  if (card === "お年寄り") {
    if (!board[i].handrail) return alert("手すりのみ");
    board[i].player = currentPlayer;
    if (board[i-1]) board[i-1].player = null;
    if (board[i+1]) board[i+1].player = null;
  }

  if (card === "ぶっとび") {
    if (usedSpecial[currentPlayer]) return alert("使用済み");
    board[i].player = currentPlayer;
    usedSpecial[currentPlayer] = true;
  }

  hands[currentPlayer].splice(selectedCard.index,1);
  selectedCard = null;

  currentPlayer = currentPlayer === "A" ? "B" : "A";
  await save();
}
</script>

</body>
</html>
